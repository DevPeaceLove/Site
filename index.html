<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Página</title>
<meta name="theme-color" content="#07070c">
<style>
  :root { --accent:#7c5cff; --bg:#07070c; --panel:#11111a; --line:rgba(255,255,255,.10); --muted:rgba(255,255,255,.62); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:#fff; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { height:100dvh; }

  /* ---------- Fundo (vídeo) ---------- */
  #bg { position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg); }
  #bg video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #bg iframe { position:absolute; top:50%; left:50%; border:0; pointer-events:none;
    width:max(100vw, 177.78vh); height:max(100vh, 56.25vw); transform:translate(-50%,-50%); }

  /* Fundo animado (aparece quando não há vídeo ou ele falha) */
  #fallback { position:absolute; inset:0; overflow:hidden;
    background: radial-gradient(120% 90% at 50% 110%, #15122b 0%, var(--bg) 60%); }
  #fallback i { position:absolute; width:55vmax; height:55vmax; border-radius:50%; filter:blur(70px); opacity:.55;
    animation: flutuar 22s ease-in-out infinite alternate; }
  #fallback i:nth-child(1){ background:radial-gradient(circle,var(--accent),transparent 65%); top:-20%; left:-15%; }
  #fallback i:nth-child(2){ background:radial-gradient(circle,#19c3ff,transparent 65%); bottom:-25%; right:-15%; animation-duration:28s; animation-delay:-8s; opacity:.38; }
  #fallback i:nth-child(3){ background:radial-gradient(circle,#ff4fa3,transparent 65%); top:30%; left:35%; animation-duration:34s; animation-delay:-15s; opacity:.25; }
  @keyframes flutuar { to { transform: translate(12vmax,-8vmax) scale(1.2); } }
  @media (prefers-reduced-motion: reduce){ #fallback i{ animation:none; } }

  #scrim { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 32%),
      linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,0) 38%); }

  /* ---------- Interface ---------- */
  .ui { position:fixed; inset:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .titles { max-width:min(760px, 70vw); }
  h1 { font-size:clamp(1.7rem, 5vw, 3.4rem); line-height:1.05; font-weight:800; letter-spacing:-.025em; text-shadow:0 2px 24px rgba(0,0,0,.45); }
  .sub { margin-top:.6em; font-size:clamp(.95rem, 2.2vw, 1.25rem); color:var(--muted); text-shadow:0 1px 12px rgba(0,0,0,.5); }
  .actions { display:flex; gap:10px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end; }
  .btn { appearance:none; border:1px solid var(--line); background:rgba(20,20,30,.55); color:#fff; cursor:pointer;
    padding:11px 18px; border-radius:999px; font:600 .92rem/1 inherit; font-family:inherit; text-decoration:none;
    display:inline-flex; align-items:center; gap:8px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:background .2s, transform .15s, border-color .2s; }
  .btn:hover { background:rgba(40,40,60,.7); border-color:rgba(255,255,255,.25); }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:var(--accent); border-color:transparent; }
  .btn.primary:hover { background:var(--accent); filter:brightness(1.12); }
  .btn.ghost { padding:9px 14px; font-weight:500; font-size:.82rem; color:var(--muted); }
  .btn:focus-visible, .close:focus-visible, .file:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  .bottom { display:flex; flex-direction:column; align-items:center; gap:18px; }
  #legenda { min-height:3.2em; max-width:min(900px, 92vw); text-align:center; white-space:pre-line;
    font-size:clamp(1.15rem, 3.4vw, 2rem); font-weight:600; line-height:1.3; text-shadow:0 2px 20px rgba(0,0,0,.7);
    opacity:0; transform:translateY(8px); transition:opacity .45s ease, transform .45s ease; }
  #legenda.on { opacity:1; transform:none; }
  .bar { width:100%; display:flex; justify-content:space-between; align-items:center; gap:10px; pointer-events:auto; }
  .btn.round svg { display:block; }
  .btn.round { width:48px; height:48px; padding:0; border-radius:50%; justify-content:center; font-size:1.2rem; line-height:1; }
  #modoLocal { pointer-events:none; font-size:.75rem; color:var(--muted); padding:6px 10px; border:1px dashed var(--line); border-radius:8px; background:rgba(0,0,0,.35); }

  /* ---------- Painel de arquivos ---------- */
  #overlay { position:fixed; inset:0; z-index:5; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .25s; }
  #overlay.open { opacity:1; pointer-events:auto; }
  #painel { position:fixed; top:0; right:0; bottom:0; z-index:6; width:min(440px, 100vw); background:var(--panel);
    border-left:1px solid var(--line); transform:translateX(102%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; box-shadow:-20px 0 60px rgba(0,0,0,.5); }
  #painel.open { transform:none; }
  .ph { display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--line); }
  .ph h2 { font-size:1.15rem; font-weight:700; }
  .close { appearance:none; background:transparent; border:0; color:var(--muted); font-size:1.7rem; line-height:1; cursor:pointer; padding:4px 10px; border-radius:8px; }
  .close:hover { color:#fff; background:rgba(255,255,255,.08); }
  #lista { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
  .file { display:flex; align-items:center; gap:14px; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
    text-decoration:none; color:#fff; background:rgba(255,255,255,.025); transition:background .2s, border-color .2s; }
  .file:hover { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.22); }
  .ext { flex:none; width:44px; height:44px; border-radius:10px; display:grid; place-items:center; font-size:.68rem; font-weight:800;
    letter-spacing:.04em; background:color-mix(in srgb, var(--accent) 22%, transparent); color:#fff; text-transform:uppercase; }
  .fi { min-width:0; flex:1; }
  .fn { font-weight:600; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fs { font-size:.78rem; color:var(--muted); margin-top:3px; }
  .dl { flex:none; color:var(--muted); font-size:1.2rem; }
  .msg { padding:30px 16px; text-align:center; color:var(--muted); font-size:.92rem; line-height:1.55; }
  .msg a { color:#fff; }
  .pf { padding:12px 22px; border-top:1px solid var(--line); font-size:.74rem; color:var(--muted); }

  #toast { position:fixed; left:50%; bottom:28px; z-index:9; transform:translate(-50%, 20px); opacity:0; pointer-events:none;
    background:#1b1b28; border:1px solid var(--line); padding:12px 18px; border-radius:12px; font-size:.88rem; max-width:90vw; text-align:center;
    transition:opacity .25s, transform .25s; }
  #toast.on { opacity:1; transform:translate(-50%,0); }

  @media (max-width:560px){
    .titles { max-width:100%; }
    .top { flex-direction:column; }
    .actions { justify-content:flex-start; }
    .btn { padding:10px 15px; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="scrim"></div>

<main class="ui">
  <div class="top">
    <div class="titles">
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnArquivos" type="button">⬇ <span id="rotuloArquivos">Arquivos</span></button>
      <a class="btn ghost" id="btnGerenciar" href="#" hidden>⚙ Gerenciar</a>
    </div>
  </div>

  <div class="bottom">
    <div id="legenda" aria-live="polite"></div>
    <div class="bar">
      <button class="btn round" id="btnSom" type="button" hidden aria-label="Som" aria-pressed="false" title="Ativar som"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <span id="modoLocal" hidden>Prévia local · usando dados de exemplo</span>
    </div>
  </div>
</main>

<div id="overlay"></div>
<aside id="painel" role="dialog" aria-modal="true" aria-labelledby="tituloPainel" aria-hidden="true">
  <div class="ph">
    <h2 id="tituloPainel">Arquivos para download</h2>
    <button class="close" id="fechar" type="button" aria-label="Fechar">×</button>
  </div>
  <div id="lista"></div>
  <div class="pf" id="rodapePainel"></div>
</aside>
<div id="toast" role="status"></div>
<audio id="audio" preload="none" loop></audio>

<script>
(function () {
  "use strict";

  /* =====================================================================
     DADOS DE EXEMPLO EMBUTIDOS
     Usados ao abrir o arquivo com duplo clique (file://) ou se o
     config.json não puder ser carregado. No GitHub Pages, o config.json
     passa a mandar em tudo.
     ===================================================================== */
  var CONFIG_PADRAO = {
    titulo: "Bem-vindo ao meu espaço",
    subtitulo: "Vídeo em tela cheia, legendas e downloads em uma única página.",
    video: "",                       // vazio = fundo animado de exemplo
    video_mudo_inicial: true,
    controles_nativos: false,
    musica: "",                      // ex.: "midia/musica.mp3" (vazio = sem música de fundo)
    musica_volume: 0.18,             // 0 a 1 (0.18 = baixo e discreto)
    musica_tocar_ao_abrir: true,
    legendas_intervalo_segundos: 4,
    legendas: [
      { texto: "Isto é uma prévia local da sua página.",           inicio: 1,  fim: 5 },
      { texto: "As legendas vêm do arquivo config.json.",          inicio: 6,  fim: 10 },
      { texto: "Troque o vídeo editando só uma linha.",            inicio: 11, fim: 15 },
      { texto: "Os arquivos da pasta \"arquivos/\" viram downloads.", inicio: 16, fim: 20 }
    ],
    mostrar_gerenciar: true,
    texto_botao_arquivos: "Arquivos",
    cor_destaque: "#7c5cff",
    pasta_arquivos: "arquivos",
    repositorio: { usuario: "", repo: "", branch: "main" }
  };

  var ARQUIVOS_EXEMPLO = [
    { name: "guia-de-exemplo.pdf",   size: 482133 },
    { name: "pacote-completo.zip",   size: 15728640 },
    { name: "planilha-modelo.xlsx",  size: 38210 },
    { name: "documento-exemplo.docx", size: 91742 }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var ehLocal = location.protocol === "file:";
  var cfg = CONFIG_PADRAO;
  var fonte = "relogio";           // "mp4" | "yt" | "relogio"
  var videoEl = null, ytFrame = null;
  var inicio = performance.now();
  var ytTempo = null, ytTempoEm = 0;
  var somLigado = false;

  /* ---------------- Utilidades ---------------- */
  function mesclar(base, extra) {
    var out = {}, k;
    for (k in base) out[k] = base[k];
    if (extra && typeof extra === "object") {
      for (k in extra) {
        if (k.charAt(0) === "_") continue;               // chaves "_comentario" são ignoradas
        if (extra[k] !== null && typeof extra[k] === "object" && !Array.isArray(extra[k]) &&
            base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) {
          out[k] = mesclar(base[k], extra[k]);
        } else {
          out[k] = extra[k];
        }
      }
    }
    return out;
  }

  var toastTimer;
  function aviso(texto) {
    var t = $("toast"); t.textContent = texto; t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("on"); }, 3800);
  }

  function formatarTamanho(b) {
    if (!b && b !== 0) return "";
    var u = ["B", "KB", "MB", "GB"], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i === 0 ? b : b.toFixed(b >= 10 ? 0 : 1)) + " " + u[i];
  }

  function extensao(nome) {
    var m = /\.([a-z0-9]{1,5})$/i.exec(nome);
    return m ? m[1] : "arq";
  }

  function idYoutube(url) {
    var m = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/.exec(url);
    return m ? m[1] : null;
  }

  /* ---------------- Detectar repositório (GitHub Pages) ---------------- */
  function repositorio() {
    var r = cfg.repositorio || {};
    var usuario = r.usuario, repo = r.repo, branch = r.branch || "main";
    if ((!usuario || !repo) && /\.github\.io$/i.test(location.hostname)) {
      usuario = usuario || location.hostname.split(".")[0];
      var seg = location.pathname.split("/").filter(Boolean)[0];
      repo = repo || (seg && !/\.html?$/i.test(seg) ? seg : location.hostname);
    }
    return (usuario && repo) ? { usuario: usuario, repo: repo, branch: branch } : null;
  }

  /* ---------------- Vídeo ---------------- */
  function mostrarFallback(motivo) {
    var bg = $("bg");
    bg.innerHTML = '<div id="fallback"><i></i><i></i><i></i></div>';
    fonte = "relogio"; videoEl = null; ytFrame = null;
    $("btnSom").hidden = !audioEl;
    if (motivo && !ehLocal) console.warn("Vídeo indisponível:", motivo);
  }

  function montarVideo() {
    var bg = $("bg"), url = (cfg.video || "").trim();
    bg.innerHTML = "";
    if (!url) { mostrarFallback(); return; }

    var yt = idYoutube(url);
    if (yt) {
      fonte = "yt";
      var mudo = cfg.video_mudo_inicial !== false ? 1 : 0;
      var origem = ehLocal ? "" : "&origin=" + encodeURIComponent(location.origin);
      ytFrame = document.createElement("iframe");
      ytFrame.src = "https://www.youtube-nocookie.com/embed/" + yt +
        "?autoplay=1&mute=" + mudo + "&loop=1&playlist=" + yt +
        "&controls=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3&disablekb=1&enablejsapi=1" + origem;
      ytFrame.allow = "autoplay; encrypted-media; picture-in-picture";
      ytFrame.setAttribute("title", "Vídeo de fundo");
      ytFrame.addEventListener("load", function () {
        try { ytFrame.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*"); } catch (e) {}
      });
      bg.appendChild(ytFrame);
      somLigado = !mudo;
    } else {
      fonte = "mp4";
      videoEl = document.createElement("video");
      videoEl.src = url;
      videoEl.autoplay = true; videoEl.loop = true; videoEl.playsInline = true;
      videoEl.muted = cfg.video_mudo_inicial !== false;
      videoEl.setAttribute("playsinline", ""); videoEl.setAttribute("muted", "");
      videoEl.preload = "auto";
      if (cfg.controles_nativos) videoEl.controls = true;
      videoEl.addEventListener("error", function () { mostrarFallback("não foi possível carregar " + url); });
      bg.appendChild(videoEl);
      var p = videoEl.play(); if (p && p.catch) p.catch(function () {});
      somLigado = !videoEl.muted;
    }
    atualizarBotaoSom();
    $("btnSom").hidden = !!(cfg.controles_nativos && fonte === "mp4");
  }

  var ICONE_SOM_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';
  var ICONE_SOM_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';

  function atualizarBotaoSom() {
    var b = $("btnSom");
    b.innerHTML = somLigado ? ICONE_SOM_ON : ICONE_SOM_OFF;
    b.title = somLigado ? "Desligar som" : "Ativar som";
    b.setAttribute("aria-pressed", somLigado ? "true" : "false");
  }

  function alternarSom() {
    somLigado = !somLigado;
    aplicarSom();
  }

  function aplicarSom() {
    if (fonte === "mp4" && videoEl) {
      videoEl.muted = !somLigado;
      var p = videoEl.play(); if (p && p.catch) p.catch(function () {});
    } else if (fonte === "yt" && ytFrame) {
      var cmd = function (f, a) { ytFrame.contentWindow.postMessage(JSON.stringify({ event: "command", func: f, args: a || [] }), "*"); };
      if (somLigado) { cmd("unMute"); cmd("setVolume", [100]); } else { cmd("mute"); }
      cmd("playVideo");
    }
    if (audioEl) { if (somLigado) tocarMusica(); else { clearInterval(fadeTimer); audioEl.pause(); } }
    atualizarBotaoSom();
  }

  window.addEventListener("message", function (e) {
    if (!ytFrame || e.source !== ytFrame.contentWindow) return;
    var d = e.data;
    try { if (typeof d === "string") d = JSON.parse(d); } catch (x) { return; }
    if (d && d.event === "infoDelivery" && d.info && typeof d.info.currentTime === "number") {
      ytTempo = d.info.currentTime; ytTempoEm = performance.now();
    }
  });

  /* ---------------- Música de fundo (controlada pelo mesmo botão de som) ---------------- */
  var audioEl = null, fadeTimer = null;

  function volumeAlvo() {
    var v = Number(cfg.musica_volume);
    return (v >= 0 && v <= 1) ? v : 0.18;
  }

  // Entra suavemente (fade de ~2,5 s) até o volume discreto configurado
  function tocarMusica(aoFalhar) {
    if (!audioEl) return;
    clearInterval(fadeTimer);
    var alvo = volumeAlvo();
    audioEl.volume = 0;
    var subir = function () {
      var passo = 0, total = 25;
      fadeTimer = setInterval(function () {
        passo++;
        audioEl.volume = Math.min(alvo, alvo * passo / total);
        if (passo >= total) clearInterval(fadeTimer);
      }, 100);
    };
    var p = audioEl.play();
    if (p && p.then) {
      p.then(subir, function () {
        somLigado = false; atualizarBotaoSom();
        if (aoFalhar) aoFalhar();
      });
    } else { subir(); }
  }

  // Se o navegador bloquear o som automático, liga no primeiro toque/clique do visitante
  function esperarPrimeiroToque() {
    var eventos = ["click", "touchend", "keydown"];
    var iniciar = function (e) {
      eventos.forEach(function (ev) { document.removeEventListener(ev, iniciar, true); });
      if (e.target && e.target.closest && e.target.closest("#btnSom")) return;
      if (!somLigado) { somLigado = true; aplicarSom(); }
    };
    eventos.forEach(function (ev) { document.addEventListener(ev, iniciar, true); });
  }

  function montarMusica() {
    var url = (cfg.musica || "").trim();
    if (!url) return;
    audioEl = $("audio");
    audioEl.src = url; audioEl.loop = true;
    audioEl.addEventListener("error", function () {
      clearInterval(fadeTimer); audioEl = null;
      aviso("Não foi possível carregar a música: " + url);
      $("btnSom").hidden = !(fonte === "mp4" || fonte === "yt");
    });
    $("btnSom").hidden = false;
    if (cfg.musica_tocar_ao_abrir !== false) {
      somLigado = true; atualizarBotaoSom();        // tenta tocar ao abrir
      tocarMusica(esperarPrimeiroToque);             // se bloquear, espera o primeiro toque
    } else {
      atualizarBotaoSom();
    }
  }

  /* ---------------- Legendas ---------------- */
  function tempoAtual() {
    if (fonte === "mp4" && videoEl && !videoEl.paused && videoEl.readyState > 1) return { t: videoEl.currentTime, real: true };
    if (fonte === "yt" && ytTempo !== null && performance.now() - ytTempoEm < 1500) return { t: ytTempo, real: true };
    return { t: (performance.now() - inicio) / 1000, real: false };
  }

  function ultimoFim(lista, intervalo) {
    var m = 0;
    lista.forEach(function (l) { var f = typeof l.fim === "number" ? l.fim : l.inicio + intervalo; if (f > m) m = f; });
    return m;
  }

  var legendaAtual = -2;
  function tick() {
    var lista = Array.isArray(cfg.legendas) ? cfg.legendas.filter(function (l) { return l && l.texto; }) : [];
    var el = $("legenda");
    if (!lista.length) { el.classList.remove("on"); return; }

    var intervalo = Number(cfg.legendas_intervalo_segundos) > 0 ? Number(cfg.legendas_intervalo_segundos) : 4;
    var comTempo = lista.every(function (l) { return typeof l.inicio === "number"; });
    var tt = tempoAtual(), t = tt.t, idx = -1;

    if (comTempo) {
      if (!tt.real) { var D = ultimoFim(lista, intervalo) + 1; if (D > 0) t = t % D; }
      for (var i = 0; i < lista.length; i++) {
        var l = lista[i], fim = typeof l.fim === "number" ? l.fim : l.inicio + intervalo;
        if (t >= l.inicio && t < fim) { idx = i; break; }
      }
    } else {
      idx = Math.floor(t / intervalo) % lista.length;     // modo automático: troca a cada N segundos
    }

    if (idx !== legendaAtual) {
      legendaAtual = idx;
      if (idx < 0) { el.classList.remove("on"); return; }
      el.classList.remove("on");
      setTimeout(function () {
        if (legendaAtual !== idx) return;
        el.textContent = lista[idx].texto; el.classList.add("on");
      }, el.textContent ? 220 : 0);
    }
  }

  /* ---------------- Arquivos ---------------- */
  var arquivosCarregados = false;

  function linhaArquivo(nome, tamanho, href, exemplo) {
    var a = document.createElement("a");
    a.className = "file"; a.href = href || "#";
    if (!exemplo) { a.setAttribute("download", nome); a.target = "_blank"; a.rel = "noopener"; }
    else a.addEventListener("click", function (e) { e.preventDefault(); aviso("Exemplo: depois de subir no GitHub, o download funciona de verdade."); });
    var ext = document.createElement("div"); ext.className = "ext"; ext.textContent = extensao(nome);
    var fi = document.createElement("div"); fi.className = "fi";
    var fn = document.createElement("div"); fn.className = "fn"; fn.textContent = nome; fn.title = nome;
    var fs = document.createElement("div"); fs.className = "fs"; fs.textContent = formatarTamanho(tamanho);
    fi.appendChild(fn); fi.appendChild(fs);
    var dl = document.createElement("div"); dl.className = "dl"; dl.textContent = "↓";
    a.appendChild(ext); a.appendChild(fi); a.appendChild(dl);
    return a;
  }

  function mensagem(html) { var lista = $("lista"); lista.innerHTML = '<div class="msg">' + html + '</div>'; }

  function carregarArquivos() {
    if (arquivosCarregados) return;
    var lista = $("lista"), rodape = $("rodapePainel");
    var pasta = (cfg.pasta_arquivos || "arquivos").replace(/^\/+|\/+$/g, "");

    if (ehLocal) {
      lista.innerHTML = "";
      ARQUIVOS_EXEMPLO.forEach(function (f) { lista.appendChild(linhaArquivo(f.name, f.size, "#", true)); });
      rodape.textContent = "Lista de exemplo. No GitHub Pages ela mostra os arquivos reais da pasta “" + pasta + "/”.";
      arquivosCarregados = true; return;
    }

    var r = repositorio();
    if (!r) {
      mensagem("Não consegui descobrir o repositório automaticamente.<br>Preencha <b>repositorio</b> (usuario e repo) no <b>config.json</b>.");
      return;
    }

    mensagem("Carregando…");
    var api = "https://api.github.com/repos/" + r.usuario + "/" + r.repo + "/contents/" + pasta + "?ref=" + encodeURIComponent(r.branch);
    var pastaWeb = "https://github.com/" + r.usuario + "/" + r.repo + "/tree/" + r.branch + "/" + pasta;

    fetch(api, { headers: { "Accept": "application/vnd.github+json" } })
      .then(function (res) {
        if (res.status === 404) throw new Error("404");
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      })
      .then(function (itens) {
        var arqs = (Array.isArray(itens) ? itens : []).filter(function (i) {
          return i.type === "file" && !/^\.|^readme(\.md)?$/i.test(i.name);
        });
        if (!arqs.length) { mensagem("Nenhum arquivo disponível por enquanto."); arquivosCarregados = true; return; }
        lista.innerHTML = "";
        arqs.forEach(function (i) { lista.appendChild(linhaArquivo(i.name, i.size, i.download_url)); });
        rodape.textContent = arqs.length + (arqs.length === 1 ? " arquivo" : " arquivos");
        arquivosCarregados = true;
      })
      .catch(function (err) {
        if (String(err.message) === "403") mensagem("Limite temporário da API do GitHub atingido. Tente novamente em alguns minutos.");
        else if (String(err.message) === "404") mensagem("A pasta <b>" + pasta + "/</b> não foi encontrada no repositório.<br>Crie-a e envie ao menos um arquivo.");
        else mensagem("Não foi possível carregar a lista agora.<br><a href='" + pastaWeb + "' target='_blank' rel='noopener'>Ver a pasta no GitHub</a>");
      });
  }

  function abrirPainel() {
    carregarArquivos();
    $("overlay").classList.add("open"); $("painel").classList.add("open"); $("painel").setAttribute("aria-hidden", "false");
    $("fechar").focus();
  }
  function fecharPainel() {
    $("overlay").classList.remove("open"); $("painel").classList.remove("open"); $("painel").setAttribute("aria-hidden", "true");
    $("btnArquivos").focus();
  }

  /* ---------------- Gerenciar ---------------- */
  function configurarGerenciar() {
    var b = $("btnGerenciar");
    if (cfg.mostrar_gerenciar === false) { b.hidden = true; return; }
    b.hidden = false;
    var r = repositorio();
    if (ehLocal || !r) {
      b.href = "#";
      b.addEventListener("click", function (e) { e.preventDefault(); aviso("O botão Gerenciar leva ao seu repositório depois que a página estiver no GitHub Pages."); });
    } else {
      b.href = "https://github.com/" + r.usuario + "/" + r.repo + "/edit/" + r.branch + "/config.json";
      b.target = "_blank"; b.rel = "noopener";
      b.title = "Abre o config.json para edição (só funciona para quem tem permissão no repositório)";
    }
  }

  /* ---------------- Aplicar configuração ---------------- */
  function aplicar() {
    document.documentElement.style.setProperty("--accent", cfg.cor_destaque || "#7c5cff");
    $("titulo").textContent = cfg.titulo || "";
    $("subtitulo").textContent = cfg.subtitulo || "";
    $("subtitulo").hidden = !cfg.subtitulo;
    if (cfg.titulo) document.title = cfg.titulo;
    $("rotuloArquivos").textContent = cfg.texto_botao_arquivos || "Arquivos";
    $("modoLocal").hidden = !ehLocal;
    montarVideo();
    montarMusica();
    configurarGerenciar();
    inicio = performance.now(); legendaAtual = -2;
    setInterval(tick, 200); tick();
  }

  /* ---------------- Eventos ---------------- */
  $("btnArquivos").addEventListener("click", abrirPainel);
  $("fechar").addEventListener("click", fecharPainel);
  $("overlay").addEventListener("click", fecharPainel);
  $("btnSom").addEventListener("click", alternarSom);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") fecharPainel(); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && videoEl) { var p = videoEl.play(); if (p && p.catch) p.catch(function () {}); }
  });

  /* ---------------- Início ---------------- */
  if (ehLocal) {
    aplicar();                                   // abre direto com os dados de exemplo
  } else {
    fetch("config.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { cfg = mesclar(CONFIG_PADRAO, j); })
      .catch(function (e) { console.warn("config.json indisponível, usando dados embutidos.", e); })
      .then(aplicar);
  }
})();
</script>
</body>
</html>
